general {
  lock_cmd = qs ipc call lockScreen lock
  before_sleep_cmd = loginctl lock-session && sleep 0.5
  after_sleep_cmd = hyprctl dispatch dpms on
  ignore_dbus_inhibit = true
}

listener {
  timeout = 300
  on-timeout = brightnessctl -s set 15%
  on-resume = brightnessctl -r
}

listener {
  timeout = 600
  on-timeout = loginctl lock-session
}

listener {
  timeout = 780
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on
}

listener {
  timeout = 900
  on-timeout = grep -q Discharging /sys/class/power_supply/BAT*/status 2>/dev/null && systemctl suspend
  on-resume = hyprctl dispatch dpms on
}
